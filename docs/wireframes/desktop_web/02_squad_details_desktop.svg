<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <rect x="10" y="10" width="1180" height="880" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <rect x="10" y="10" width="1180" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="30" y="46" font-size="20" font-weight="bold" fill="#f8fafc">← SQUAD DETAILS: Squad 1 — Heavy Armor (48 TV)</text>
  <rect x="1030" y="22" width="140" height="36" rx="6" fill="#dc2626" />
  <text x="1050" y="45" font-size="13" font-weight="bold" fill="#ffffff">🗑 Delete Squad</text>

  <!-- Squad Summary Header Card -->
  <rect x="30" y="85" width="1140" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="50" y="112" font-size="16" font-weight="bold" fill="#38bdf8">Squad Command &amp; Role Settings</text>
  <text x="1000" y="112" font-size="16" font-weight="bold" fill="#f8fafc">Total TV: 48 TV</text>

  <text x="50" y="140" font-size="12" fill="#94a3b8">Primary Role (Set by 1iC)</text>
  <rect x="50" y="147" width="280" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="60" y="168" font-size="13" fill="#f8fafc">GP — General Purpose ▼</text>

  <text x="350" y="140" font-size="11" fill="#94a3b8">Secondary Role (Optional)</text>
  <rect x="350" y="147" width="280" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="360" y="168" font-size="13" fill="#f8fafc">FS — Fire Support ▼</text>

  <text x="660" y="140" font-size="11" fill="#94a3b8">Squad Leaders</text>
  <text x="660" y="168" font-size="13" fill="#bfdbfe" font-weight="bold">1iC: Jaguar (CO ⭐ CGL)  |  2iC: Grizzly (2iC)</text>

  <!-- Squad-Wide Upgrades Section -->
  <rect x="30" y="210" width="1140" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="50" y="235" font-size="15" font-weight="bold" fill="#f8fafc">SQUAD-WIDE UPGRADES (Applies to all eligible Gears in squad)</text>

  <rect x="50" y="250" width="1100" height="85" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="70" y="273" font-size="13" fill="#f8fafc"><tspan font-weight="bold" fill="#38bdf8">[X] Light Grenades (LHG) (+1 TV)</tspan> — Adds Light Hand Grenade (LHG) to Mounted Column for all Gears</text>
  <text x="70" y="295" font-size="13" fill="#cbd5e1"><tspan font-weight="bold">[  ] Medium Panzerfausts (MPZ) (+2 TV)</tspan> — Adds Medium Panzerfaust (MPZ) to Mounted Column for all Gears</text>
  <text x="70" y="317" font-size="13" fill="#cbd5e1"><tspan font-weight="bold">[  ] Shaped Explosives (LSE) (+1 TV)</tspan> — Adds Light Shaped Explosive (LSE) to Mounted Column for all Gears</text>

  <!-- Model List Cards -->
  <rect x="30" y="365" width="1140" height="505" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="50" y="392" font-size="15" font-weight="bold" fill="#f8fafc">SQUAD MODELS (4 / 9 Units)</text>
  <rect x="1020" y="375" width="130" height="28" rx="6" fill="#2563eb" />
  <text x="1035" y="393" font-size="12" font-weight="bold" fill="#ffffff">+ Select Unit</text>

  <!-- Model 1 -->
  <rect x="50" y="410" width="1100" height="95" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
  <text x="70" y="432" font-size="14" font-weight="bold" fill="#f8fafc">1. Jaguar (Command Unit) — 15 TV</text>
  <text x="70" y="452" font-size="12" fill="#bfdbfe"><tspan font-weight="bold">Rank:</tspan> CO ⭐ CGL (+2 TV)  |  <tspan font-weight="bold">Level:</tspan> Veteran (+1 TV)  |  <tspan font-weight="bold">Duelist:</tspan> Off  |  <tspan font-weight="bold">Role Match:</tspan> GP (Primary)</text>
  <text x="70" y="470" font-size="11" fill="#94a3b8" font-family="monospace">Move: 6" Walker | ARM: 7 | HS: 2 | A: 2 | GU: 4+ | PI: 4+ | EW: 3+ (CO +1) | CP: 1</text>
  <text x="70" y="488" font-size="11" fill="#4ade80">Upgrades Enabled: [X] Sabertooth Weapon Swap (0 TV)  |  [X] Initiative Plus (+1 TV)</text>

  <!-- Model 2 -->
  <rect x="50" y="515" width="1100" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="537" font-size="14" font-weight="bold" fill="#f8fafc">2. Grizzly — 13 TV</text>
  <text x="70" y="557" font-size="12" fill="#cbd5e1"><tspan font-weight="bold">Rank:</tspan> 2iC (+1 TV)  |  <tspan font-weight="bold">Level:</tspan> Regular  |  <tspan font-weight="bold">Duelist:</tspan> Off  |  <tspan font-weight="bold">Role Match:</tspan> FS (Secondary)</text>
  <text x="70" y="575" font-size="11" fill="#94a3b8" font-family="monospace">Move: 5" Walker | ARM: 8 | HS: 2 | A: 1 | GU: 4+ | PI: 4+ | EW: 5+ | CP: 1</text>

  <!-- Model 3 -->
  <rect x="50" y="605" width="1100" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="627" font-size="14" font-weight="bold" fill="#f8fafc">3. Hunter — 10 TV</text>
  <text x="70" y="647" font-size="12" fill="#cbd5e1"><tspan font-weight="bold">Rank:</tspan> Trooper  |  <tspan font-weight="bold">Level:</tspan> Regular  |  <tspan font-weight="bold">Duelist:</tspan> Off  |  <tspan font-weight="bold">Role Match:</tspan> GP (Primary)</text>
  <text x="70" y="665" font-size="11" fill="#94a3b8" font-family="monospace">Move: 6" Walker | ARM: 6 | HS: 2 | A: 1 | GU: 4+ | PI: 4+ | EW: 6+ | CP: 0</text>

  <!-- Model 4 -->
  <rect x="50" y="695" width="1100" height="80" rx="6" fill="#1a2e05" stroke="#84cc16" stroke-width="1" />
  <text x="70" y="717" font-size="14" font-weight="bold" fill="#a3e635">4. Hunter (Green Downgrade) — 9 TV (-1 TV)</text>
  <text x="70" y="737" font-size="12" fill="#d9f99d"><tspan font-weight="bold">Rank:</tspan> Trooper  |  <tspan font-weight="bold">Level:</tspan> GREEN (-1 TV Discount)  |  <tspan font-weight="bold">Role Match:</tspan> GP (Primary)</text>
  <text x="70" y="755" font-size="11" fill="#a3e635" font-family="monospace">Move: 6" Walker | ARM: 6 | HS: 2 | A: 1 | GU: 4+ | PI: 4+ | EW: 6+ (Green: -1 out of formation)</text>

</svg>