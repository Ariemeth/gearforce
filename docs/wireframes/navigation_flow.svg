  <rect x="770" y="150" width="180" height="35" rx="6" fill="#172554" stroke="#38bdf8" stroke-width="2" />
  <text x="785" y="172" font-size="11" font-weight="bold" fill="#38bdf8">Squads List (Combat Groups)</text>

  <!-- Level 2: Squad Details Screen -->
  <path d="M 860 185 L 500 240" stroke="#38bdf8" stroke-width="2" />

