  <rect x="350" y="70" width="300" height="40" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="2" />
  <text x="375" y="95" font-size="14" font-weight="bold" fill="#ffffff">1. Roster Screen (CG Force Level)</text>

  <path d="M 350 90 L 150 150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 420 110 L 320 150" stroke="#475569" stroke-width="2" />
  <path d="M 500 110 L 500 150" stroke="#475569" stroke-width="2" />
  <path d="M 580 110 L 680 150" stroke="#475569" stroke-width="2" />
  <path d="M 650 90 L 850 150" stroke="#475569" stroke-width="2" />

