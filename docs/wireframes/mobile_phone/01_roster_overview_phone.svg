  <!-- Mobile Bottom Navigation Bar -->
  <rect x="5" y="775" width="380" height="64" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1" />

  <text x="45" y="802" font-size="18" fill="#38bdf8">📋</text>
