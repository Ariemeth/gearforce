  <text x="25" y="315" font-size="10" fill="#cbd5e1">• 3. Hunter x2 (Trooper, Green/Reg) [19 TV]</text>
  <text x="25" y="335" font-size="10" fill="#38bdf8">Tap to view/edit squad details →</text>

