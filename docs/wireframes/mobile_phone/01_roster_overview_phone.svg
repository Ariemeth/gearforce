  <text x="115" y="422" font-size="9" font-weight="bold" fill="#cbd5e1">REGULAR SQUAD</text>

  <text x="25" y="445" font-size="10" fill="#cbd5e1">• Cheetah (1iC), Ferret x2, Blackcat x2</text>
  <text x="25" y="465" font-size="10" fill="#94a3b8">Tap to view/edit squad details →</text>

  <!-- Squad 3 Mobile Card (Warning) -->
  <rect x="15" y="488" width="360" height="120" rx="8" fill="#1e293b" stroke="#ca8a04" stroke-width="1" />
  <text x="25" y="510" font-size="13" font-weight="bold" fill="#f8fafc">≡ Squad 3: Fire Support</text>
  <text x="325" y="510" font-size="13" font-weight="bold" fill="#eab308">40 TV</text>
  <text x="25" y="528" font-size="11" fill="#fde047">Roles: FS  •  3 Units ⚠️  •  4 Actions</text>

  <rect x="25" y="538" width="80" height="20" rx="4" fill="#334155" stroke="#64748b" stroke-width="1" />
  <text x="30" y="552" font-size="9" font-weight="bold" fill="#cbd5e1">1iC: 1iC (1 TV)</text>

  <rect x="110" y="538" width="140" height="20" rx="4" fill="#713f12" stroke="#eab308" stroke-width="1" />
  <text x="115" y="552" font-size="9" font-weight="bold" fill="#fef08a">⚠️ Size Warning (&lt;4 units)</text>

  <text x="25" y="575" font-size="10" fill="#fde047">• Kodiak (1iC), Wildfire x2</text>
