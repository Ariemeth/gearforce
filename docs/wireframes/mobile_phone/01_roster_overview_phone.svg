  <text x="325" y="220" font-size="13" font-weight="bold" fill="#38bdf8">48 TV</text>
  <text x="25" y="238" font-size="11" fill="#94a3b8">Roles: GP / FS  •  4 Units  •  5 Actions</text>

  <rect x="25" y="248" width="115" height="20" rx="4" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
  <text x="30" y="262" font-size="9" font-weight="bold" fill="#fef08a">⭐ CGL: Capt. Vance</text>

  <rect x="145" y="248" width="80" height="20" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
  <text x="150" y="262" font-size="9" font-weight="bold" fill="#bfdbfe">1iC: CO (2 TV)</text>

