<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <rect x="5" y="5" width="380" height="834" rx="32" fill="#1e293b" stroke="#334155" stroke-width="3" />

  <!-- Dimmed Background Overlay Header -->
  <rect x="5" y="5" width="380" height="150" fill="#020617" opacity="0.8" />
  <text x="20" y="38" font-size="14" fill="#64748b">GEARFORCE (Background)</text>

  <!-- Mobile Bottom Sheet Container (Modal Overlay) -->
  <rect x="5" y="120" width="380" height="719" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

  <!-- Bottom Sheet Handle -->
  <rect x="170" y="132" width="50" height="5" rx="3" fill="#475569" />

  <text x="25" y="165" font-size="15" font-weight="bold" fill="#f8fafc">FACTION ASSET RULES COMPLIANCE</text>
  <text x="25" y="185" font-size="11" fill="#cbd5e1">North — Northern Guard Field Guide Limits</text>

  <!-- Asset List Cards -->
  <!-- Asset 1: Vet Squads -->
  <rect x="25" y="200" width="340" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="35" y="222" font-size="12" font-weight="bold" fill="#f8fafc">Veteran / Elite Squads</text>
  <text x="35" y="240" font-size="10" fill="#cbd5e1">Limit: Max 2 Squads  •  Current: 1 Squad</text>
  <rect x="285" y="217" width="65" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1" />
  <text x="293" y="232" font-size="9" font-weight="bold" fill="#bbf7d0">✓ VALID</text>

  <!-- Asset 2: Duelists -->
  <rect x="25" y="265" width="340" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="35" y="287" font-size="12" font-weight="bold" fill="#f8fafc">Duelists / Aces</text>
  <text x="35" y="305" font-size="10" fill="#cbd5e1">Limit: Max 2 Duelists  •  Current: 1 Duelist</text>
  <rect x="285" y="282" width="65" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1" />
  <text x="293" y="297" font-size="9" font-weight="bold" fill="#bbf7d0">✓ VALID</text>

  <!-- Asset 3: Green Squads -->
  <rect x="25" y="330" width="340" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="35" y="352" font-size="12" font-weight="bold" fill="#f8fafc">Green Squads</text>
  <text x="35" y="370" font-size="10" fill="#cbd5e1">Limit: Max 1 Squad  •  Current: 0 Squads</text>
  <rect x="285" y="347" width="65" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1" />
  <text x="293" y="362" font-size="9" font-weight="bold" fill="#bbf7d0">✓ VALID</text>

  <!-- Asset 4: Squad Sizes -->
  <rect x="25" y="395" width="340" height="65" rx="6" fill="#1e293b" stroke="#ca8a04" stroke-width="1" />
  <text x="35" y="417" font-size="12" font-weight="bold" fill="#f8fafc">Squad Sizes (4-9 Units)</text>
  <text x="35" y="435" font-size="10" fill="#fde047">Squad 3 has 3 units (Need 4-9 units)</text>
  <text x="35" y="450" font-size="10" fill="#94a3b8">Tap to add model or use "Get Small" rule</text>
  <rect x="270" y="412" width="80" height="22" rx="4" fill="#713f12" stroke="#eab308" stroke-width="1" />
  <text x="276" y="427" font-size="9" font-weight="bold" fill="#fef08a">⚠️ NOTICE</text>

  <!-- Off-Board Assets Section in Sheet -->
  <text x="25" y="485" font-size="13" font-weight="bold" fill="#f8fafc">OFF-BOARD CG ASSETS</text>

  <rect x="25" y="495" width="340" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="35" y="517" font-size="12" font-weight="bold" fill="#f8fafc">Airstrike Counters (3 TV each)</text>
  <text x="35" y="535" font-size="10" fill="#94a3b8">Off-board call for fire airstrikes.</text>
  <rect x="255" y="510" width="24" height="24" rx="4" fill="#334155" />
  <text x="263" y="526" font-size="14" font-weight="bold" fill="#ffffff">-</text>
  <text x="290" y="526" font-size="14" font-weight="bold" fill="#38bdf8">1</text>
  <rect x="310" y="510" width="24" height="24" rx="4" fill="#2563eb" />
  <text x="318" y="526" font-size="14" font-weight="bold" fill="#ffffff">+</text>

  <rect x="25" y="570" width="340" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="35" y="592" font-size="12" font-weight="bold" fill="#f8fafc">Artillery Counters (4 TV each)</text>
  <text x="35" y="610" font-size="10" fill="#94a3b8">Off-board heavy artillery bombardment.</text>
  <rect x="255" y="585" width="24" height="24" rx="4" fill="#334155" />
  <text x="263" y="601" font-size="14" font-weight="bold" fill="#ffffff">-</text>
  <text x="290" y="601" font-size="14" font-weight="bold" fill="#cbd5e1">0</text>
  <rect x="310" y="585" width="24" height="24" rx="4" fill="#2563eb" />
  <text x="318" y="601" font-size="14" font-weight="bold" fill="#ffffff">+</text>

  <!-- Action Button -->
  <rect x="25" y="660" width="340" height="42" rx="8" fill="#2563eb" />
  <text x="135" y="686" font-size="14" font-weight="bold" fill="#ffffff">Close Rules Sheet</text>

</svg>