  <text x="325" y="352" font-size="13" font-weight="bold" fill="#16a34a">15 TV</text>

  <rect x="25" y="360" width="55" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
  <text x="30" y="372" font-size="9" font-weight="bold" fill="#92400e">⭐ CGL</text>

