  <text x="207" y="133" font-size="11" fill="#0f172a">FS — Support ▼</text>

  <text x="25" y="162" font-size="10" fill="#1e40af"><tspan font-weight="bold">Leaders:</tspan> 1iC: CO ⭐ Capt. Vance  |  2iC: Grizzly</text>

  <!-- Squad-Wide Upgrades Card -->
  <rect x="15" y="185" width="360" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
