  <text x="25" y="228" font-size="11" fill="#1d4ed8"><tspan font-weight="bold">[X] Light Grenades (LHG) (+1 TV)</tspan></text>
  <text x="25" y="248" font-size="11" fill="#475569">[  ] Medium Panzerfausts (MPZ) (+2 TV)</text>
  <text x="25" y="268" font-size="11" fill="#475569">[  ] Shaped Explosives (LSE) (+1 TV)</text>

  <!-- Models List Title -->
  <text x="20" y="315" font-size="14" font-weight="bold" fill="#0f172a">SQUAD MODELS (4 / 9)</text>
