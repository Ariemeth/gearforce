<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <rect x="5" y="5" width="380" height="834" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />

