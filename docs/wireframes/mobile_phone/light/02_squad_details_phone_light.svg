  <text x="30" y="681" font-size="9" font-weight="bold" fill="#3f6212">GREEN (-1 TV)</text>

  <text x="25" y="703" font-size="10" fill="#3f6212" font-family="monospace">Move: 6" W | ARM: 6 | HS: 2 | A: 1 | GU: 4+ | EW: 6+ (Green)</text>

