name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  format:
    name: Check Dart Code Formatting & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Just
        uses: extra-actions/setup-just@v2

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: just deps

      - name: Check Dart code formatting and static analysis
        run: just check

  test:
    name: Run Tests on Ubuntu
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Just
        uses: extra-actions/setup-just@v2

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: just deps

      - name: Run tests
        run: just test

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: apk
          - os: ubuntu-latest
            target: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Just
        uses: extra-actions/setup-just@v2

      - name: Setup Java JDK
        if: matrix.target == 'apk'
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\flutter' || '~/.flutter' }}
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\runneradmin\\AppData\\Local\\Pub\\Cache' || '~/.pub-cache' }}
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: just deps

      - name: Build target
        run: just build-${{ matrix.target }}
