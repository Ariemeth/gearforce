name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FLUTTER_VERSION: 3.35.1

jobs:
  format:
    name: Check Dart Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dart code is formatted correctly
        run: dart format --set-exit-if-changed .

  test:
    name: Run Tests on Ubuntu
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # Use the Eclipse Temurin distribution
          java-version: '21'       # Set Java version to 21
          cache: 'gradle'          # Cache Gradle dependencies

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\flutter' || '~/.flutter' }}
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\runneradmin\\AppData\\Local\\Pub\\Cache' || '~/.pub-cache' }}
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build APK
        if: matrix.target == 'android'
        run: flutter build apk

      - name: Build Web App
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Run linter
        run: flutter analyze


