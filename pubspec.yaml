name: gearforce
description: "A Heavy Gear Blitz force creation application."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  meta: ^1.19.0
  shared_preferences: ^2.5.6

  intl: any
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  excel: ^4.0.0

flutter:
  uses-material-design: true

  # Enable automatic generation of localized strings from arb files.
  generate: true

  assets:
    - assets/images/
    - assets/data/units/
