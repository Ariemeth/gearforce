name: gearforce
description: "A Heavy Gear Blitz force creation application."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  meta: ^1.19.0
  shared_preferences: ^2.5.6
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0

dependency_overrides:
  build: ^5.0.0
  analyzer: ^14.3.0

flutter:
  uses-material-design: true

  # Disable the generation of the synthetic packages as part of the migration.
  generate: true

  assets:
    - assets/images/
    - assets/data/units/
