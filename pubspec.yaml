name: gearforce
description: "A Heavy Gear Blitz force creation application."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  meta: ^1.17.0
  shared_preferences: ^2.5.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.1
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  # Disable the generation of the synthetic packages as part of the migration.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/data/units/
    - assets/data/weapons/
